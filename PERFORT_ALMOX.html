    // --- STORAGE & HELPERS ---
    function getActiveObra() {
      try {
        const raw = localStorage.getItem('perfort_almox_obra_atual');
        return raw ? JSON.parse(raw) : DEFAULT_OBRAS[0];
      } catch (e) {
        return DEFAULT_OBRAS[0];
      }
    }

    function setActiveObra(obra) {
      if (obra) {
        localStorage.setItem('perfort_almox_obra_atual', JSON.stringify(obra));
      } else {
        localStorage.removeItem('perfort_almox_obra_atual');
      }
    }

    function getTenantPrefix() {
      const obra = getActiveObra();
      return obra && obra.id ? `tenant_${obra.id}_` : 'tenant_none_';
    }

    function tget(key, defaultValue) {
      try {
        const raw = localStorage.getItem(getTenantPrefix() + key);
        return raw !== null ? JSON.parse(raw) : defaultValue;
      } catch (e) {
        return defaultValue;
      }
    }

    function tset(key, value) {
      try {
        localStorage.setItem(getTenantPrefix() + key, JSON.stringify(value));
      } catch (e) {
        console.error(e);
      }
    }

    function getSaldo(item) {
      const init = item.quantidade || 0;
      const ent = item.entradas_total || 0;
      const sai = item.saidas_total || 0;
      return init + ent - sai;
    }

    function getStatus(item) {
      const saldo = getSaldo(item);
      const min = item.estoque_min || 0;
      if (saldo <= 0) return 'CRÍTICO';
      if (saldo <= min) return 'BAIXO';
      return 'OK';
    }

    function formatCurrency(val) {
      if (val == null || isNaN(val)) return 'R$ 0,00';
      return 'R$ ' + Number(val).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatNumber(val, decimals = 2) {
      if (val == null || isNaN(val)) return '0,00';
      return Number(val).toFixed(decimals).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function exportToExcel(filename, sheetName, data) {
      if (!data || data.length === 0) {
        alert('Nenhum dado para exportar.');
        return;
      }
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, `${filename}_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }

    function auditLog(action, detail) {
      try {
        const rawSess = localStorage.getItem('perfort_almox_session');
        const session = rawSess ? JSON.parse(rawSess) : null;
        const obra = getActiveObra();
        const entry = {
          timestamp: new Date().toLocaleString('pt-BR'),
          username: session ? session.username : 'desconhecido',
          action,
          detail,
          obra: obra ? obra.nome : 'Geral'
        };
        const current = JSON.parse(localStorage.getItem('perfort_almox_audit') || '[]');
        current.unshift(entry);
        if (current.length > 300) current.length = 300;
        localStorage.setItem('perfort_almox_audit', JSON.stringify(current));
      } catch (e) {}
    }

    function EntradasView({ items, entradas, preselectedCodigo, onUpdate }) {
      const [codigo, setCodigo] = useState(preselectedCodigo || '');
      const [qtd, setQtd] = useState('');
      const [valorUnit, setValorUnit] = useState('');
      const [fornecedor, setFornecedor] = useState('');
      const [nf, setNf] = useState('');

      useEffect(() => { if (preselectedCodigo) setCodigo(preselectedCodigo); }, [preselectedCodigo]);

      const handleAdd = (e) => {
        e.preventDefault();
        const data = tget('data', { items: [], entradas: [], nextEntradaId: 1 });
        const item = data.items.find(i => i.codigo === codigo);
        if (!item) return;

        const quantity = parseFloat(qtd) || 0;
        const price = parseFloat(valorUnit) || 0;

        const newEntrada = {
          id: data.nextEntradaId || 1,
          data: new Date().toISOString().slice(0, 10),
          codigo,
          nome: item.nome,
          qtd: quantity,
          valor_unit: price,
          valor_total: quantity * price,
          fornecedor,
          nf
        };

        data.nextEntradaId = (data.nextEntradaId || 1) + 1;
        data.entradas.unshift(newEntrada);
        item.entradas_total = (item.entradas_total || 0) + quantity;
        if (price > 0) item.preco_medio = price;

        tset('data', data);
        onUpdate();
        setQtd(''); setValorUnit(''); setNf('');
        auditLog('REGISTRAR_ENTRADA', `Entrada NF ${nf} - ${quantity}x ${codigo}`);
      };

      return (
        <div className="space-y-6">
          <form onSubmit={handleAdd} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3 text-xs">

            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <input type="number" step="0.01" placeholder="Preço Unitário (R$)" value={valorUnit} onChange={e=>setValorUnit(e.target.value)} className="p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
              <input type="text" placeholder="Fornecedor" value={fornecedor} onChange={e=>setFornecedor(e.target.value)} className="p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
              <input type="text" placeholder="Nº Nota Fiscal" value={nf} onChange={e=>setNf(e.target.value)} className="p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
            </div>

    function InventarioView({ items, onUpdate }) {
      const [contagens, setContagens] = useState({});

      const handleAjuste = (item) => {
        const contada = parseFloat(contagens[item.codigo]);
        if (isNaN(contada)) return;
        const saldo = getSaldo(item);
        const diff = contada - saldo;
        if (diff === 0) return;

        const data = tget('data', { items: [] });
        const target = data.items.find(i => i.codigo === item.codigo);
        if (target) {
          target.quantidade = (target.quantidade || 0) + diff;
          tset('data', data);
          onUpdate();
          auditLog('AJUSTE_INVENTARIO', `Estoque do item ${item.codigo} ajustado por inventário em ${diff}`);
        }
      };

      return (
        <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
          <h3 className="font-bold text-sm text-slate-800 dark:text-white">📋 Contagem de Inventário Físico & Ajustes</h3>
          <div className="overflow-x-auto">
            <table className="w-full text-xs text-left">
              <thead className="bg-slate-50 dark:bg-slate-800 text-slate-500 uppercase font-bold text-[10px]">
                <tr>
                  <th className="p-2.5">Código</th>
                  <th className="p-2.5">Insumo</th>
                  <th className="p-2.5 text-right">Saldo Sistema</th>
                  <th className="p-2.5 text-center">Qtd Contada</th>
                  <th className="p-2.5 text-right">Diferença</th>
                  <th className="p-2.5 text-center">Ação</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                {items.map(i => {
                  const saldo = getSaldo(i);
                  const contada = contagens[i.codigo] !== undefined ? parseFloat(contagens[i.codigo]) : saldo;
                  const diff = isNaN(contada) ? 0 : contada - saldo;

                  return (
                    <tr key={i.codigo}>
                      <td className="p-2.5 font-mono font-bold">{i.codigo}</td>
                      <td className="p-2.5 font-bold">{i.nome}</td>
                      <td className="p-2.5 text-right font-black">{formatNumber(saldo)} {i.unidade}</td>
                      <td className="p-2.5 text-center">
                        <input
                          type="number"
                          step="0.01"
                          value={contagens[i.codigo] !== undefined ? contagens[i.codigo] : saldo}
                          onChange={e => setContagens({ ...contagens, [i.codigo]: e.target.value })}
                          className="w-20 p-1 text-center bg-slate-50 dark:bg-slate-800 border rounded-lg font-bold"
                        />
                      </td>
                      <td className="p-2.5 text-right font-bold">
                        <span className={diff === 0 ? 'text-slate-400' : diff > 0 ? 'text-amber-500' : 'text-red-500'}>
                          {diff > 0 ? `+${formatNumber(diff)}` : formatNumber(diff)}
                        </span>
                      </td>
                      <td className="p-2.5 text-center">
                        <button
                          onClick={() => handleAjuste(i)}
                          disabled={diff === 0}
                          className={`px-3 py-1 rounded-lg text-xs font-bold ${diff === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-[#0D1F2D] text-[#C9A358]'}`}
                        >
                          Ajustar
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function BackupView({ onRestore }) {
      const handleBackup = () => {
        const snap = {
          tenantData: tget('data', {}),
          cqData: tget('cq_concretagem', []),
          exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `PERFORT_Backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      const handleUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed.tenantData) {
              tset('data', parsed.tenantData);
              if (parsed.cqData) tset('cq_concretagem', parsed.cqData);
              alert('Dados restaurados com sucesso!');
              onRestore();
            }
          } catch (err) { alert('Erro no arquivo JSON.'); }
        };
        reader.readAsText(file);
      };

      const auditLogs = JSON.parse(localStorage.getItem('perfort_almox_audit') || '[]');

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4 text-xs">
            <h3 className="font-bold text-sm text-slate-800 dark:text-white">💾 Backup, Restauração & Auditoria</h3>
            <div className="flex gap-3">
              <button onClick={handleBackup} className="px-4 py-2.5 bg-gradient-to-r from-[#C9A358] to-[#b8924a] text-[#0D1F2D] font-extrabold rounded-xl">
                📥 Baixar Backup JSON
              </button>
              <label className="px-4 py-2.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold rounded-xl cursor-pointer">
                📂 Importar Arquivo JSON
                <input type="file" accept=".json" onChange={handleUpload} className="hidden" />
              </label>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
            <h3 className="font-bold text-sm text-slate-800 dark:text-white">📜 Logs de Auditoria de Operações</h3>
            <div className="bg-slate-950 p-4 rounded-xl font-mono text-xs text-slate-300 space-y-1.5 max-h-60 overflow-y-auto">
              {auditLogs.map((log, idx) => (
                <div key={idx} className="flex gap-2 text-[11px]">
                  <span className="text-slate-500">[{log.timestamp}]</span>
                  <span className="text-[#C9A358] font-bold">{log.username}</span>
                  <span className="text-emerald-400">({log.obra}):</span>
                  <span>{log.action} — {log.detail}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

        setInput('');

        setTimeout(() => {
          setMessages([...newMsgs, {
            role: 'model',
            text: `### 🛒 Sugestão Inteligente de Compras — PERFORT ALMOX\n\nAnalisando insumos críticos da obra:\n1. **Cimento CP II-F 32 (Saco 50kg)**: Nível Crítico (20 SC em estoque). Recomendado pedido imediato de **300 SC**.\n2. **Luva de Vaqueta Cano Curto**: Estoque zerado. Compra urgente de **50 PAR** para atender NR-18.\n3. **Vergalhão CA-50 12.5mm**: Repor 500 KG para lajes dos próximos pavimentos.`
          }]);
        }, 500);
      };

      return (
        <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4 text-xs max-w-3xl mx-auto">
          <h3 className="font-bold text-sm text-slate-800 dark:text-white flex items-center gap-2">🤖 Assistente Virtual de Engenharia IA</h3>
          <div className="flex gap-2">
            <button onClick={() => handleSend('Sugestão de Compras')} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 font-bold rounded-xl">🛒 Compras</button>
            <button onClick={() => handleSend('Análise de Desperdício')} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 font-bold rounded-xl">🚨 Desperdício</button>
          </div>
          <div className="bg-slate-50 dark:bg-slate-800/80 p-4 rounded-xl space-y-3 min-h-[300px] max-h-[450px] overflow-y-auto">
            {messages.map((m, idx) => (
              <div key={idx} className={`p-3 rounded-xl max-w-[85%] ${m.role==='user'?'ml-auto bg-[#0D1F2D] text-white':'bg-white dark:bg-slate-900 border text-slate-800 dark:text-slate-100'}`}>
                <div className="font-bold mb-1">{m.role==='user'?'Você':'Assistente IA'}</div>
                <div className="whitespace-pre-line leading-relaxed">{m.text}</div>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <input type="text" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} placeholder="Digite sua dúvida ou solicitação..." className="flex-1 p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
            <button onClick={() => handleSend()} className="px-4 py-2.5 bg-[#0D1F2D] text-[#C9A358] font-bold rounded-xl">Enviar</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
